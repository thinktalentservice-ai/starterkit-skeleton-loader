name: Release

# Fires when a GitHub release is published. One build gates two independent
# jobs: publish to npm, and (only if the repo already ships Storybook on
# GitHub Pages) redeploy the Pages site. Neither runs if the build fails.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # lets the detect step see whether a Pages site exists
    outputs:
      version: ${{ steps.meta.outputs.version }}
      storybook: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Publishing a tag that disagrees with package.json would ship the wrong
      # version number to npm. Fail before anything is published.
      - name: Tag must match package.json version
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser

      # "Only if already published to GitHub Pages": Storybook must be set up
      # here AND a Pages site must already exist. Pages is read through the
      # API, so no config flag has to be kept in sync by hand.
      - name: Detect Storybook on GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=false
          if node -e "process.exit(require('./package.json').scripts?.['build-storybook'] ? 0 : 1)"; then
            if gh api "repos/${{ github.repository }}/pages" --jq .build_type >/tmp/build_type 2>/dev/null; then
              enabled=true
              echo "Pages site exists (build_type=$(cat /tmp/build_type))."
            else
              echo "::notice::build-storybook script found but no GitHub Pages site yet; skipping Pages deploy."
            fi
          else
            echo "::notice::No build-storybook script; skipping Pages deploy."
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  # ── npm ─────────────────────────────────────────────────────────────────
  publish-npm:
    name: publish-npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in this Environment (Settings → Environments → npm), not
    # in the repo. Add required reviewers there to gate each publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@devopsnext/starterkit-skeleton-loader/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # dist/ is not committed and nothing builds on publish, so build here.
      - run: pnpm build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── GitHub Pages (Storybook) ────────────────────────────────────────────
  deploy-pages:
    name: deploy-pages
    needs: build
    if: needs.build.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build-storybook

      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

      - id: deployment
        uses: actions/deploy-pages@v5
