name: CI

# Runs on every push (any branch) and on every pull request. The `verify` job
# is the required status check that gates merging — see README "Releasing".
on:
  push:
    branches: ["**"]
    # A tag push is a release; release.yml owns that.
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7 targets Node 24 natively; matches the sibling starterkit repos.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + unit tests + build (tsc --noEmit && tsup).
      - run: pnpm verify

      # jsdom cannot lay anything out, so `pnpm verify` only proves the
      # extraction rules. Whether a bone lands on its element is proven here.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser
